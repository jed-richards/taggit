[project]
name = "taggit-backend"
version = "0.1.0"
description = "Taggit API — FastAPI + SQLAlchemy backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.13.0",
    "cryptography>=49.0.0",
    "httpx>=0.28.1",
    "boto3>=1.43.46",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerated migrations keep their generated style.
"alembic/versions/*" = ["E501", "UP", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
