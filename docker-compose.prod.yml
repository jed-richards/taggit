# Prod-like local run: the full monolith (API + built frontend) plus Postgres.
#   docker compose -f docker-compose.prod.yml up --build
# App on http://localhost:8000 — one origin, no vite, no CORS.
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/taggit
    env_file:
      - backend/.env # Supabase + R2 secrets
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taggit
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata_prod:
